name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: 后端测试（Spring Boot）
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 配置 Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: 编译与测试
        run: ./mvnw -q test
        working-directory: mall-server
  web:
    name: 前端构建（Vue）
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: 安装依赖
        run: npm ci
        working-directory: mall-web
      - name: 构建
        run: npm run build
        working-directory: mall-web
