version: 2

updates:
  - package-ecosystem: npm
    directory: /mall-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /mall-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      maven-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
