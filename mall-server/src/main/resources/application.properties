spring.application.name=mall-server
# 凭据由环境变量注入；Spring Boot 不会自动读取根目录 .env。
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/mall_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.map-underscore-to-camel-case=true
